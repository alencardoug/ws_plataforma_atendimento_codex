services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oncology}
      POSTGRES_USER: ${POSTGRES_USER:-oncology}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oncology_demo_change_me}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres17_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oncology} -d ${POSTGRES_DB:-oncology}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://oncology:oncology_demo_change_me@db:5432/oncology}
      GLOBAL_MATURITY_MODE: ${GLOBAL_MATURITY_MODE:-N2}
      N1_ASSISTIVE_SEARCH_ENABLED: ${N1_ASSISTIVE_SEARCH_ENABLED:-true}
      OPERATOR_MAX_ACTIVE_CONVERSATIONS: ${OPERATOR_MAX_ACTIVE_CONVERSATIONS:-4}
      ANONYMOUS_TOKEN_PEPPER: ${ANONYMOUS_TOKEN_PEPPER:?set ANONYMOUS_TOKEN_PEPPER in .env}
      OPERATOR_AUTH_SECRET: ${OPERATOR_AUTH_SECRET:?set OPERATOR_AUTH_SECRET in .env}
      OPERATOR_AUTH_TTL_MINUTES: ${OPERATOR_AUTH_TTL_MINUTES:-480}
      ANONYMOUS_TOKEN_RATE_LIMIT_MAX_FAILURES: ${ANONYMOUS_TOKEN_RATE_LIMIT_MAX_FAILURES:-30}
      ANONYMOUS_TOKEN_RATE_LIMIT_WINDOW_SECONDS: ${ANONYMOUS_TOKEN_RATE_LIMIT_WINDOW_SECONDS:-60}
      ANONYMOUS_TOKEN_RATE_LIMIT_BASE_LOCKOUT_SECONDS: ${ANONYMOUS_TOKEN_RATE_LIMIT_BASE_LOCKOUT_SECONDS:-60}
      ANONYMOUS_TOKEN_RATE_LIMIT_MAX_LOCKOUT_SECONDS: ${ANONYMOUS_TOKEN_RATE_LIMIT_MAX_LOCKOUT_SECONDS:-900}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_GENERATION_MODEL: ${AI_GENERATION_MODEL:-gpt-5-mini}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION:-1536}
      API_ROOT_PATH: ${API_ROOT_PATH:-/api/v1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./documents:/workspace/documents:ro
      - ./prompts:/workspace/prompts:ro

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres17_data:
