services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oncology}
      POSTGRES_USER: ${POSTGRES_USER:-oncology}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oncology_demo_change_me}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oncology} -d ${POSTGRES_DB:-oncology}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://oncology:oncology_demo_change_me@db:5432/oncology}
      CPF_ENCRYPTION_KEY: ${CPF_ENCRYPTION_KEY:-demo-only-change-before-use-32bytes}
      APP_TIMEZONE: America/Sao_Paulo
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./documents:/app/documents:ro

volumes:
  postgres_data:
