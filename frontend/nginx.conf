server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri /index.html; }
  location /api/ {
    proxy_pass http://backend:8000;
    # Set (never append/pass through) from nginx's own view of the peer —
    # the backend's per-source rate limiter (customer_care/shared/http.py
    # client_ip()) trusts this as the real client address. Using
    # $remote_addr here, not $proxy_add_x_forwarded_for, means any
    # client-supplied X-Forwarded-For is discarded rather than trusted.
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
